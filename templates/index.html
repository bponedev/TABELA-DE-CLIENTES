{% extends "base.html" %}
{% block content %}
<h1>Novo Cadastro</h1>
<div class="card">
<form action="{{ url_for('registros.submit') }}" method="post">
  <label>Nome
    <input name="nome" required>
  </label>

  <label>CPF
    <input name="cpf">
  </label>

  <label>Escritório Dono
    <select name="escritorio_dono" required>
      {% for o in offices %}
        <option value="{{ o.display }}">{{ o.display }}</option>
      {% endfor %}
    </select>
  </label>

  <label>Tipo de ação
    <input name="tipo_acao">
  </label>

  <label>Data do fechamento
    <input type="date" name="data_fechamento">
  </label>

  <label>Pendências
    <textarea name="pendencias"></textarea>
  </label>

  <label>Nº do processo
    <input name="numero_processo">
  </label>

  <label>Data do protocolo
    <input type="date" name="data_protocolo">
  </label>

  <label>Observações
    <textarea name="observacoes"></textarea>
  </label>

  <label>Captador
    <select name="captador">
      <option>PAGO</option>
      <option>NÃO PAGO</option>
    </select>
  </label>

  <label>Escritórios Vinculados
    <div class="checkbox-group">
      {% for o in offices %}
        <label class="chkitem">
          <input type="checkbox" name="offices_linked" value="{{ o.display }}">{{ o.display }}
        </label>
      {% endfor %}
    </div>
  </label>

  <label>Tags (separa por vírgula)
    <input type="text" name="tags" placeholder="ADMINISTRATIVO, JURÍDICO">
  </label>
  <div id="tag-preview" class="tag-preview"></div>

  <button class="btn-primary" type="submit">Salvar</button>
</form>
</div>
{% endblock %}
