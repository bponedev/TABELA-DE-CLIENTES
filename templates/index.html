{% extends "base.html" %}

{% block content %}
<h2>Novo Cadastro</h2>

<form action="{{ url_for('submit') }}" method="POST" class="card">

    <!-- NOME -->
    <label>Nome</label>
    <input type="text" name="nome" required>

    <!-- CPF -->
    <label>CPF</label>
    <input type="text" name="cpf">

    <!-- ESCRITÓRIO DONO -->
    <label>Escritório Dono</label>
    <select name="escritorio_dono" required>
        {% for o in offices %}
            <option value="{{ o.display }}">{{ o.display }}</option>
        {% endfor %}
    </select>

    <!-- TIPO DE AÇÃO -->
    <label>Tipo de Ação</label>
    <input type="text" name="tipo_acao">

    <!-- DATA FECHAMENTO -->
    <label>Data de Fechamento</label>
    <input type="date" name="data_fechamento">

    <!-- PENDÊNCIAS -->
    <label>Pendências</label>
    <textarea name="pendencias"></textarea>

    <!-- NÚMERO DO PROCESSO -->
    <label>Número do Processo</label>
    <input type="text" name="numero_processo">

    <!-- DATA DE PROTOCOLO -->
    <label>Data de Protocolo</label>
    <input type="date" name="data_protocolo">

    <!-- OBSERVAÇÕES -->
    <label>Observações</label>
    <textarea name="observacoes"></textarea>

    <!-- CAPTADOR -->
    <label>Captador</label>
    <input type="text" name="captador">

    <!-- TAGS -->
    <label>Tags (separe por vírgula)</label>
    <input type="text" name="tags" placeholder="EX: administrativo, judicial">

    <!-- ESCRITÓRIOS VINCULADOS -->
    <label>Escritórios Vinculados</label>
    <div class="checkbox-list">
        {% for o in offices %}
            <label class="check-item">
                <input type="checkbox" name="offices_linked" value="{{ o.display }}">
                {{ o.display }}
            </label>
        {% endfor %}
    </div>

    <!-- BOTÃO -->
    <button type="submit" class="btn-primary">Salvar Registro</button>
</form>

{% endblock %}
