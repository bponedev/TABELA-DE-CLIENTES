{% extends "base.html" %}
{% block content %}
<h2>Editar Escritório</h2>
<div class="card">
  <form method="POST" action="">
    <label>Chave (não altera):<input type="text" value="{{ office.key }}" disabled></label>
    <label>Nome de Exibição:<input type="text" name="display_name" value="{{ office.display }}" required></label>
    <button class="btn-primary">Salvar</button>
    <a class="btn-secondary" href="{{ url_for('offices.offices_page') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
