{% extends "base.html" %}

{% block content %}
<h2>Editar Escritório</h2>

<div class="card dark-card">

    <form method="POST" action="">

        <!-- CHAVE (fixa) -->
        <label>Chave (não pode alterar):</label>
        <input type="text" value="{{ office.office_key }}" disabled>

        <!-- NOME DO ESCRITÓRIO -->
        <label>Nome de Exibição:</label>
        <input type="text" name="display_name"
               value="{{ office.display_name }}"
               required>

        <button class="btn-primary">Salvar Alterações</button>

        <a href="{{ url_for('offices_page') }}" class="btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
