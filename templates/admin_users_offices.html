{% extends "base.html" %}
{% block content %}
<h2>Vincular Escritórios</h2>
<div class="card">
  <form method="POST" action="{{ url_for('admin.user_offices', user_id=user_id) }}">
    <div class="checkbox-group">
      {% for o in offices %}
        <label class="chkitem"><input type="checkbox" name="offices" value="{{ o.key }}" {% if o.key in user_offs %}checked{% endif %}>{{ o.display }}</label>
      {% endfor %}
    </div>
    <button class="btn-primary">Salvar Vínculos</button>
    <a class="btn-secondary" href="{{ url_for('admin.users') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
