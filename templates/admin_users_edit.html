{% extends "base.html" %}
{% block content %}
<h2>Editar Usuário</h2>
<div class="card">
  <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
    <label>Username<input type="text" value="{{ user.username }}" disabled></label>
    <label>Nome completo<input name="full_name" value="{{ user.full_name }}" required></label>
    <label>Função
      <select name="role">
        <option value="ADMIN" {% if user.role=='ADMIN' %}selected{% endif %}>ADMIN</option>
        <option value="SUPERVISOR" {% if user.role=='SUPERVISOR' %}selected{% endif %}>SUPERVISOR</option>
        <option value="OPERADOR" {% if user.role=='OPERADOR' %}selected{% endif %}>OPERADOR</option>
        <option value="VISUALIZADOR" {% if user.role=='VISUALIZADOR' %}selected{% endif %}>VISUALIZADOR</option>
      </select>
    </label>
    <label>Status
      <select name="active">
        <option value="1" {% if user.active==1 %}selected{% endif %}>Ativo</option>
        <option value="0" {% if user.active==0 %}selected{% endif %}>Inativo</option>
      </select>
    </label>
    <button class="btn-primary">Salvar</button>
    <a class="btn-secondary" href="{{ url_for('admin.users') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
