{% extends "base.html" %}
{% block content %}
<h2>Criar Usuário</h2>
<div class="card">
  <form method="POST" action="{{ url_for('admin.create_user') }}">
    <label>Username<input name="username" required></label>
    <label>Nome completo<input name="full_name" required></label>
    <label>Senha inicial<input type="password" name="password" required></label>
    <label>Função
      <select name="role">
        <option>ADMIN</option><option>SUPERVISOR</option><option>OPERADOR</option><option>VISUALIZADOR</option>
      </select>
    </label>
    <label>Escritórios vinculados
      <div class="checkbox-group">
        {% for o in offices %}
          <label class="chkitem"><input type="checkbox" name="offices" value="{{ o.key }}">{{ o.display }}</label>
        {% endfor %}
      </div>
    </label>
    <button class="btn-primary">Criar</button>
    <a class="btn-secondary" href="{{ url_for('admin.users') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
